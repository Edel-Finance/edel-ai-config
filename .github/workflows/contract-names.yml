name: contract-names

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Skill names exist in the published contract
        run: python3 -I .github/scripts/check_contract_names.py

  offline:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned development checks
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/dev-tools" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          curl --fail --location --silent --show-error https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/dev-tools/shellcheck"
          echo "$RUNNER_TEMP/dev-tools" >> "$GITHUB_PATH"
          npm exec --yes --package prettier@3.9.10 -- prettier --version
      - name: Formatter, linter and all offline fixtures
        run: sh .githooks/pre-push
